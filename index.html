<p Había una vez tres chanchitos que vivían en el bosque y decidieron construir sus propias casas para protegerse de un temible lobo feroz.
El hermano menor, que era muy perezoso, fabricó su choza rápidamente utilizando paja para terminar pronto y poder irse a jugar.
El hermano mediano, un poco más trabajador, dedicó algo de tiempo a recolectar ramas y construyó una vivienda de madera.
El hermano mayor, que era el más sabio y paciente de los tres, prefirió esforzarse y levantar una casa muy resistente con ladrillos y cemento.
Pronto llegó el lobo hambriento, fue a la casa de paja y, tras decir soplaré y soplaré y tu casa derribaré, la destruyó de un soplido.
El pequeño corrió a refugiarse con el mediano, pero el lobo llegó y, con un doble soplido potente, también tiró abajo la estructura de madera.
Desesperados, ambos cerditos corrieron a la casa de ladrillo del mayor, donde se resguardaron mientras el lobo soplaba con todas sus fuerzas.
Al ver que sus soplidos no le hacían ni un rasguño a la fuerte pared, el lobo, enfurecido, decidió trepar al tejado para entrar por la chimenea.
Los astutos chanchitos, anticipando sus intenciones, colocaron una gran olla de agua hirviendo justo debajo de la salida de los humos.
El lobo cayó directamente en el agua caliente, se quemó la cola por completo y huyó del bosque dando unos aullidos terribles de dolor.
Desde aquel inolvidable día, los tres hermanos vivieron felices y seguros en la casa de ladrillo, habiendo aprendido el verdadero valor del esfuerzo.></p>
